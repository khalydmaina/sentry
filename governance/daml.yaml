sdk-version: 3.5.8
name: sentry-governance
version: 0.1.0
source: daml
dependencies:
  - daml-prim
  - daml-stdlib
data-dependencies:
  # BitSafe's Decentralization Manager, vendored as built DARs (Apache-2.0).
  # governance-action-v1 is the GovernableAction interface; governance-core-v1
  # is the GovernanceRules threshold engine that executes against it.
  - vendor/governance-action-v1-0.1.0.dar
  - vendor/governance-core-v1-0.1.0.dar
  - vendor/splice-util-0.1.4.dar
  # Sentry's own contracts: the governed action clears a held request.
  - ../main/.daml/dist/sentry-0.1.0.dar
build-options:
  - --target=2.2
