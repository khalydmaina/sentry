// Console handles for the two running participants, so topology changes can be
// made against both. Used with `dpm canton-console -c scripts/remote.conf`.
canton.remote-participants {
    sandbox {
        admin-api { port = 6866 }
        ledger-api { port = 6865 }
    }
    pebblebox {
        admin-api { port = 7866 }
        ledger-api { port = 7865 }
    }
    sidebox {
        admin-api { port = 8866 }
        ledger-api { port = 8865 }
    }
}
