// Three Canton participants on one synchronizer.
//
// Two nodes were enough to show that a counterparty never receives the policy.
// Three are needed to show that and shared control at once, because hosting the
// owner on a second node means that node legitimately holds the owner's
// contracts. Put the extra host somewhere that is nobody's counterparty:
//
//   sandbox   :6864  owner, agent          governance member 1 hosts the owner
//   sidebox   :8864  a second governance member, also hosts the owner
//   pebblebox :7864  bank, merchant, stranger, outsider, hosts neither
//
// dpm processes its own sandbox.conf first, which defines participant
// `sandbox`, sequencer1 and mediator1, so only the extra participants are here.
canton.participants {
    pebblebox {
        admin-api.port = 7866
        http-ledger-api.port = 7864
        ledger-api {
            port = 7865
            user-management-service.enabled = true
        }
        storage.type = "memory"
    }
    sidebox {
        admin-api.port = 8866
        http-ledger-api.port = 8864
        ledger-api {
            port = 8865
            user-management-service.enabled = true
        }
        storage.type = "memory"
    }
}
