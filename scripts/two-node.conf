// A second Canton participant alongside the sandbox default, on the same
// synchronizer. `dpm sandbox` processes its own config first, which already
// defines participant `sandbox`, sequencer1 and mediator1, so only the extra
// participant is declared here.
//
//   sandbox   :6864 JSON API  - hosts Owner and Agent
//   pebblebox :7864 JSON API  - hosts Bank, Merchant, Stranger and Outsider
//
// Two nodes is the whole point: the privacy page asks each participant what it
// holds, so "the bank cannot see the policy" is a fact about a separate node
// rather than a filter applied to one node's answer.
canton.participants.pebblebox {
    admin-api.port = 7866
    http-ledger-api.port = 7864
    ledger-api {
        port = 7865
        user-management-service.enabled = true
    }
    storage.type = "memory"
}
